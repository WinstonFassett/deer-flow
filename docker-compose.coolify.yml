services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SERVICE_FQDN_API_8000
      - PORT=8000
      - DEBUG=${DEBUG:-True}
      - APP_ENV=${APP_ENV:-development}
      - SEARCH_API=${SEARCH_API:-tavily}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - VOLCENGINE_TTS_APPID=${VOLCENGINE_TTS_APPID}
      - VOLCENGINE_TTS_ACCESS_TOKEN=${VOLCENGINE_TTS_ACCESS_TOKEN}
      - BASIC_MODEL_BASE_URL=${BASIC_MODEL_BASE_URL:-https://api.openai.com/v1}
      - BASIC_MODEL_NAME=${BASIC_MODEL_NAME:-gpt-4o}
      - BASIC_MODEL_API_KEY=${BASIC_MODEL_API_KEY}
    volumes:
      - type: bind
        target: /app/conf.yaml
        source: ./conf.yaml.example
        content: |
          BASIC_MODEL:
            base_url: ${BASIC_MODEL_BASE_URL}
            model: ${BASIC_MODEL_NAME}
            api_key: ${BASIC_MODEL_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000; if [ $? -eq 7 ] || [ $? -eq 28 ]; then exit 1; fi"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      - traefik.enable=true
      # Define CORS middleware
      - traefik.http.middlewares.cors-headers.headers.accesscontrolallowmethods=GET,OPTIONS,PUT,POST,DELETE,PATCH
      - traefik.http.middlewares.cors-headers.headers.accesscontrolallowheaders=*
      - traefik.http.middlewares.cors-headers.headers.accesscontrolalloworiginlist=*
      - traefik.http.middlewares.cors-headers.headers.accesscontrolmaxage=100
      - traefik.http.middlewares.cors-headers.headers.addvaryheader=true
      # Apply the middleware to all routers for this service
      - traefik.http.routers.api-${COOLIFY_RESOURCE_UUID}.middlewares=cors-headers@docker
      # Also apply to the https router that Coolify generates
      - traefik.http.routers.https-0-${COOLIFY_RESOURCE_UUID}-api.middlewares=cors-headers@docker

  app:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
       - NEXT_PUBLIC_API_URL=${SERVICE_FQDN_API_8000}/api
    environment:
      - SERVICE_FQDN_APP_3000
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${SERVICE_FQDN_API_8000}/api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "try { var hostname = require('os').hostname(); require('http').get({hostname: hostname, port: 3000, path: '/', timeout: 2000}, (res) => { process.exit(res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1); }).on('error', (e) => { console.error(e.message); process.exit(1); }).end(); } catch(e) { console.error(e); process.exit(1); }"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      - traefik.enable=true
      # We can reuse the same middleware for both services
      - traefik.http.middlewares.cors-headers.headers.accesscontrolallowmethods=GET,OPTIONS,PUT,POST,DELETE,PATCH
      - traefik.http.middlewares.cors-headers.headers.accesscontrolallowheaders=*
      - traefik.http.middlewares.cors-headers.headers.accesscontrolalloworiginlist=*
      - traefik.http.middlewares.cors-headers.headers.accesscontrolmaxage=100
      - traefik.http.middlewares.cors-headers.headers.addvaryheader=true
      # Apply the middleware to all routers for this service
      - traefik.http.routers.app-${COOLIFY_RESOURCE_UUID}.middlewares=cors-headers@docker
      # Also apply to the https router that Coolify generates
      - traefik.http.routers.https-0-${COOLIFY_RESOURCE_UUID}-app.middlewares=cors-headers@docker